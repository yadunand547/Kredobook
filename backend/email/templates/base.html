<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}KredoBook Notification{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F0F4FF;font-family:'Segoe UI',Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F0F4FF;min-height:100vh;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(37,99,235,0.12),0 1px 4px rgba(0,0,0,0.06);">
          <!-- HEADER -->
          <tr>
            <td style="background:linear-gradient(135deg,#1E40AF 0%,#2563EB 55%,#3B82F6 100%);padding:36px 40px 32px;text-align:center;border-radius:16px 16px 0 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding-bottom:14px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="background:rgba(255,255,255,0.15);border-radius:12px;padding:10px 22px;border:1px solid rgba(255,255,255,0.25);">
                          <span style="font-size:24px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">Kredo</span><span style="font-size:24px;font-weight:800;color:#93C5FD;letter-spacing:-0.5px;">Book</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="center">
                    <p style="margin:0;font-size:12px;color:rgba(255,255,255,0.7);letter-spacing:2px;text-transform:uppercase;font-weight:500;">Smart Loan Management Platform</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- BODY -->
          <tr>
            <td style="background:#ffffff;padding:0;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- FOOTER -->
          <tr>
            <td style="background:#F8FAFC;padding:28px 40px 32px;border-top:1px solid #E2E8F0;border-radius:0 0 16px 16px;text-align:center;">
              <p style="margin:0 0 4px;font-size:14px;font-weight:700;color:#374151;">KredoBook Team</p>
              <p style="margin:0 0 18px;font-size:13px;color:#6B7280;">
                <a href="mailto:kredobook@gmail.com" style="color:#2563EB;text-decoration:none;font-weight:500;">kredobook@gmail.com</a>
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="border-top:1px solid #E2E8F0;padding-top:16px;">
                  <p style="margin:0;font-size:11px;color:#9CA3AF;line-height:1.7;">
                    This is an automated notification from <strong style="color:#6B7280;">KredoBook</strong>.<br/>
                    Please do not reply directly to this email.
                  </p>
                </td></tr>
              </table>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0;font-size:11px;color:#9CA3AF;text-align:center;">&copy; 2026 KredoBook. All rights reserved.</p>
      </td>
    </tr>
  </table>
</body>
</html>
